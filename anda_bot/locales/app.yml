_version: 2

launcher.retired_title:
  en: Anda Bot tray moved to Anda Desktop
  zh-Hans: Anda Bot 托盘已并入 Anda 桌面端
  ru: Трей Anda Bot перенесён в Anda Desktop
  ar: انتقل رمز Anda Bot في شريط النظام إلى Anda Desktop
  fr: Le lanceur Anda Bot est intégré à Anda Desktop
  es: La bandeja de Anda Bot ahora está en Anda Desktop
launcher.retired_message:
  en: The Anda Bot tray launcher has been retired. Anda keeps running in the background and still starts when you log in. Install Anda Desktop for the tray, settings and updates.
  zh-Hans: Anda Bot 托盘启动器已停用。Anda 会继续在后台运行，并且仍会在登录时启动。安装 Anda 桌面端即可使用托盘、设置和更新。
  ru: Лаунчер Anda Bot в трее больше не используется. Anda продолжает работать в фоне и запускается при входе в систему. Установите Anda Desktop для трея, настроек и обновлений.
  ar: تم إيقاف مشغّل Anda Bot في شريط النظام. يواصل Anda العمل في الخلفية ويبدأ عند تسجيل الدخول. ثبّت Anda Desktop للحصول على رمز الشريط والإعدادات والتحديثات.
  fr: Le lanceur Anda Bot de la barre des tâches est retiré. Anda continue de tourner en arrière-plan et démarre toujours à l'ouverture de session. Installez Anda Desktop pour l'icône, les réglages et les mises à jour.
  es: El lanzador de bandeja de Anda Bot se ha retirado. Anda sigue ejecutándose en segundo plano y se inicia al iniciar sesión. Instala Anda Desktop para la bandeja, los ajustes y las actualizaciones.
launcher.retired_download:
  en: Download Anda Desktop
  zh-Hans: 下载 Anda 桌面端
  ru: Скачать Anda Desktop
  ar: تنزيل Anda Desktop
  fr: Télécharger Anda Desktop
  es: Descargar Anda Desktop
launcher.retired_later:
  en: Later
  zh-Hans: 稍后
  ru: Позже
  ar: لاحقًا
  fr: Plus tard
  es: Más tarde

browser.workspace_picker_title:
  en: Open a workspace folder for Anda
  zh-Hans: 选择 Anda 工作区文件夹
  ru: Откройте папку рабочего пространства для Anda
  ar: افتح مجلد مساحة عمل لـ Anda
  fr: Ouvrir un dossier d'espace de travail pour Anda
  es: Abrir una carpeta de espacio de trabajo para Anda

shell_approval.detail.approval_reason:
  en: Approval reason
  zh-Hans: 审批原因
  ru: Причина запроса
  ar: سبب طلب الموافقة
  fr: Motif de l'approbation
  es: Motivo de aprobación
shell_approval.reason.approval_required:
  en: Current approval mode requires you to confirm this command.
  zh-Hans: 当前审批模式要求你确认该命令。
  ru: Текущий режим одобрения требует подтверждения этой команды.
  ar: يتطلب وضع الموافقة الحالي تأكيد هذا الأمر.
  fr: Le mode d'approbation actuel exige que vous confirmiez cette commande.
  es: El modo de aprobación actual requiere que confirmes este comando.
shell_approval.reason.empty_command:
  en: The command is empty.
  zh-Hans: 命令为空。
  ru: Команда пуста.
  ar: الأمر فارغ.
  fr: La commande est vide.
  es: El comando está vacío.
shell_approval.reason.background_command:
  en: This command will run in the background and needs your confirmation.
  zh-Hans: 该命令将在后台运行，需要你确认。
  ru: Эта команда будет выполняться в фоне и требует подтверждения.
  ar: سيعمل هذا الأمر في الخلفية ويتطلب تأكيدك.
  fr: Cette commande s'exécutera en arrière-plan et nécessite votre confirmation.
  es: Este comando se ejecutará en segundo plano y requiere tu confirmación.
shell_approval.reason.complex_shell_syntax:
  en: This command uses complex shell syntax, so you need to confirm what will run.
  zh-Hans: 该命令包含复杂的 shell 语法，需要你确认实际要执行的操作。
  ru: Эта команда использует сложный синтаксис shell, поэтому нужно подтвердить, что именно будет выполнено.
  ar: يستخدم هذا الأمر صياغة shell معقدة، لذلك تحتاج إلى تأكيد ما سيتم تنفيذه فعلاً.
  fr: Cette commande utilise une syntaxe shell complexe ; vous devez confirmer ce qui sera réellement exécuté.
  es: Este comando usa sintaxis de shell compleja, por lo que debes confirmar qué se ejecutará.
shell_approval.reason.sensitive_path_or_secret:
  en: This command may touch sensitive paths or secret values.
  zh-Hans: 该命令可能涉及敏感路径、密钥或凭据等敏感信息。
  ru: Эта команда может затрагивать чувствительные пути или секретные значения.
  ar: قد يمس هذا الأمر مسارات حساسة أو قيماً سرية.
  fr: Cette commande peut toucher des chemins sensibles ou des valeurs secrètes.
  es: Este comando puede afectar rutas sensibles o valores secretos.
shell_approval.reason.path_outside_workspace:
  en: This command will access a path outside the active workspace.
  zh-Hans: 该命令将访问当前工作区之外的路径。
  ru: Эта команда обратится к пути вне активной рабочей области.
  ar: سيصل هذا الأمر إلى مسار خارج مساحة العمل النشطة.
  fr: Cette commande accédera à un chemin en dehors de l'espace de travail actif.
  es: Este comando accederá a una ruta fuera del espacio de trabajo activo.
shell_approval.reason.unknown_command:
  en: The risk of this command could not be identified.
  zh-Hans: 无法识别这个命令的风险。
  ru: Не удалось определить риск этой команды.
  ar: تعذر تحديد مخاطر هذا الأمر.
  fr: Le risque de cette commande n'a pas pu être identifié.
  es: No se pudo identificar el riesgo de este comando.
shell_approval.reason.network_write_or_system_change:
  en: This command may access the network, write files, or change system state.
  zh-Hans: 该命令可能会访问网络、写入文件或更改系统状态。
  ru: Эта команда может обращаться к сети, записывать файлы или изменять состояние системы.
  ar: قد يصل هذا الأمر إلى الشبكة أو يكتب ملفات أو يغيّر حالة النظام.
  fr: Cette commande peut accéder au réseau, écrire des fichiers ou modifier l'état du système.
  es: Este comando puede acceder a la red, escribir archivos o cambiar el estado del sistema.
shell_approval.reason.git_state_or_network:
  en: This git command may change repository state or access the network.
  zh-Hans: 该 Git 命令可能会修改仓库状态或访问网络。
  ru: Эта команда git может изменить состояние репозитория или обратиться к сети.
  ar: قد يغيّر أمر git هذا حالة المستودع أو يصل إلى الشبكة.
  fr: Cette commande git peut modifier l'état du dépôt ou accéder au réseau.
  es: Este comando de git puede cambiar el estado del repositorio o acceder a la red.
shell_approval.reason.unclassified_command:
  en: It is unclear whether this command is safe.
  zh-Hans: 无法确定该命令是否安全。
  ru: Неясно, безопасна ли эта команда.
  ar: من غير الواضح ما إذا كان هذا الأمر آمناً.
  fr: Il n'est pas clair si cette commande est sûre.
  es: No está claro si este comando es seguro.
shell_approval.reason.model_classified_risky:
  en: The risk model determined that this command needs your confirmation.
  zh-Hans: 风险模型判定该命令需要你确认。
  ru: Модель оценки риска решила, что эта команда требует подтверждения.
  ar: قرر نموذج المخاطر أن هذا الأمر يحتاج إلى تأكيدك.
  fr: Le modèle de risque a déterminé que cette commande nécessite votre confirmation.
  es: El modelo de riesgo determinó que este comando necesita tu confirmación.
