name: Test
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Checkout Brain source dependency
        uses: actions/checkout@v6
        with:
          repository: ldclabs/anda-brain
          ref: ee6feb12ce784827b02b715959f66df36ee5381d
          path: .ci/anda-brain
          persist-credentials: false

      - name: Place Brain beside the Bot workspace
        shell: bash
        run: mv .ci/anda-brain ../anda-brain

      - name: Install Protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc@3.23.4

      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 libasound2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --all-targets --all-features

      - name: Run tests
        env:
          RUST_MIN_STACK: 16777216
        run: cargo test --workspace -- --nocapture
