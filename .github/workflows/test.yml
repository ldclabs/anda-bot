name: Test
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  lint:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc@3.23.4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            features: --all-features
            musl_target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            musl_target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v6

      - name: Install Protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc@3.23.4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run tests
        env:
          RUST_MIN_STACK: 16777216
        run: cargo test --locked --workspace --profile ci --features code-mode ${{ matrix.features }}

      - name: Verify the native musl worker
        if: matrix.musl_target
        env:
          RUST_MIN_STACK: 16777216
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add ${{ matrix.musl_target }}
          cargo test --locked --profile ci -p anda_bot --features code-mode --target ${{ matrix.musl_target }} --test code_mode
