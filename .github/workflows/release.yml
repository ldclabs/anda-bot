name: Release
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        run: node scripts/release-config.cjs

  build-binary:
    needs: version
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            rust_target: x86_64-unknown-linux-musl
            exe_ext: ""
            build_dir: target
          - os: ubuntu-24.04-arm
            target: linux-arm64
            rust_target: aarch64-unknown-linux-musl
            exe_ext: ""
            build_dir: target
          - os: windows-latest
            target: windows-x86_64
            rust_target: x86_64-pc-windows-msvc
            exe_ext: ".exe"
            build_dir: target
          - os: macos-latest
            target: macos-arm64
            rust_target: aarch64-apple-darwin
            exe_ext: ""
            build_dir: target

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc@3.23.4

      - name: Install musl tools (Linux)
        if: ${{ contains(matrix.rust_target, 'linux-musl') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 musl-tools linux-libc-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build Rust binary (native)
        shell: bash
        run: |
          cargo build --profile code-mode-release --locked --target ${{ matrix.rust_target }} --bin anda
          # anda_launcher is now the transitional binary that retires the old
          # tray; older launchers and `anda update` still download it.
          if [[ "$RUNNER_OS" == Windows || "$RUNNER_OS" == macOS ]]; then
            cargo build --profile code-mode-release --locked --target ${{ matrix.rust_target }} --bin anda_launcher
          fi

      - name: Verify Code Mode in the release binary
        env:
          RUST_MIN_STACK: 16777216
        run: cargo test --profile code-mode-release --locked -p anda_bot --target ${{ matrix.rust_target }} --test code_mode

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release
          cp "${{ matrix.build_dir }}/${{ matrix.rust_target }}/code-mode-release/anda${{ matrix.exe_ext }}" "release/anda-${{ matrix.target }}${{ matrix.exe_ext }}"
          if [[ "$RUNNER_OS" == Windows || "$RUNNER_OS" == macOS ]]; then
            cp "${{ matrix.build_dir }}/${{ matrix.rust_target }}/code-mode-release/anda_launcher${{ matrix.exe_ext }}" "release/anda_launcher-${{ matrix.target }}${{ matrix.exe_ext }}"
          fi

          ls -lah release

      - name: Check Artifact Signing configuration
        if: ${{ runner.os == 'Windows' }}
        id: artifact-signing-config
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
        run: |
          $missing = @(
            "AZURE_CLIENT_ID",
            "AZURE_TENANT_ID",
            "AZURE_SUBSCRIPTION_ID",
            "AZURE_ARTIFACT_SIGNING_ENDPOINT",
            "AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME",
            "AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME"
          ) | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }

          if ($missing.Count -gt 0) {
            Write-Host "Azure Artifact Signing is not fully configured; skipping Windows Authenticode signing. Missing: $($missing -join ', ')"
            "configured=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          "configured=true" >> $env:GITHUB_OUTPUT

      - name: Azure login for Artifact Signing
        if: ${{ runner.os == 'Windows' && steps.artifact-signing-config.outputs.configured == 'true' }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows binaries
        if: ${{ runner.os == 'Windows' && steps.artifact-signing-config.outputs.configured == 'true' }}
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\release
          files-folder-filter: exe,dll,msi,msix,msixbundle,appx,appxbundle,cab
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Anda Bot
          description-url: https://github.com/ldclabs/anda-bot

      - name: Verify Windows binary signatures
        if: ${{ runner.os == 'Windows' && steps.artifact-signing-config.outputs.configured == 'true' }}
        shell: pwsh
        run: |
          $extensions = @(".exe", ".dll", ".msi", ".msix", ".msixbundle", ".appx", ".appxbundle", ".cab")
          foreach ($file in Get-ChildItem -LiteralPath release -File | Where-Object { $extensions -contains $_.Extension.ToLowerInvariant() }) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $($file.FullName): $($signature.Status) $($signature.StatusMessage)"
            }
            Write-Host "Verified Authenticode signature for $($file.Name)"
          }

      - name: Generate checksums
        shell: bash
        run: |
          for file in release/*; do
            if command -v sha256sum >/dev/null 2>&1; then
              hash="$(sha256sum "$file" | awk '{print $1}')"
            elif command -v shasum >/dev/null 2>&1; then
              hash="$(shasum -a 256 "$file" | awk '{print $1}')"
            else
              hash="$(openssl dgst -sha256 "$file" | awk '{print $NF}')"
            fi
            echo "$hash  $(basename "$file")" > "${file}.sha256"
          done

          ls -lah release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  # Its own job so build-binary's Azure OIDC subject does not change with the
  # environment that holds the Developer ID certificate.
  sign-macos-binary:
    needs: build-binary
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    environment: desktop-release
    steps:
      - uses: actions/checkout@v6

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release

      - name: Sign and notarize
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          binaries=(release/anda-${{ matrix.target }} release/anda_launcher-${{ matrix.target }})
          # Actions downloads create regular files without the executable bit.
          chmod +x "${binaries[@]}"
          scripts/sign-macos-binaries.sh "${binaries[@]}"
          "${binaries[0]}" --version
          for file in "${binaries[@]}"; do
            echo "$(shasum -a 256 "$file" | awk '{print $1}')  $(basename "$file")" > "${file}.sha256"
          done

      - name: Upload signed binaries
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          overwrite: true

  package-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Package skills
        shell: bash
        run: |
          mkdir -p release
          skills_archive="anda-skills.zip"

          (cd skills && zip -qr "../release/${skills_archive}" . -x '__pycache__/*' '*/__pycache__/*' '*.pyc' '.DS_Store' '*/.DS_Store')

          hash="$(sha256sum "release/${skills_archive}" | awk '{print $1}')"
          echo "$hash  ${skills_archive}" > "release/${skills_archive}.sha256"

          ls -lah release

      - name: Upload skills artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-skills
          path: release/*
          if-no-files-found: error

  build-desktop:
    needs:
      - version
      - build-binary
      - sign-macos-binary
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64
            exe_ext: ""
            certificate: MAC_CSC_LINK
            password: MAC_CSC_KEY_PASSWORD
          - os: windows-latest
            target: windows-x86_64
            exe_ext: ".exe"
            certificate: WIN_CSC_LINK
            password: WIN_CSC_KEY_PASSWORD
    runs-on: ${{ matrix.os }}
    # Signing and notarization secrets live in this protected environment.
    environment: desktop-release
    # Every packaging step must reuse this release's runtime, never rebuild it.
    env:
      ANDA_DESKTOP_RUNTIME: ${{ github.workspace }}/runtime/anda-${{ matrix.target }}${{ matrix.exe_ext }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4
        with:
          version: "11.7.0"

      # The desktop imports Chrome extension components; the website and
      # docsite dependencies are not needed for packaging.
      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile --filter "./desktop..." --filter "./chrome-extension..."

      # The desktop bundles the exact anda binary this release publishes; the
      # app installs it at the shared CLI location instead of running it.
      - name: Download release runtime
        uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: runtime

      - name: Prepare bundled runtime
        shell: bash
        run: |
          chmod +x "$ANDA_DESKTOP_RUNTIME"
          pnpm --dir desktop build
          node desktop/scripts/prepare-runtime.mjs

      - name: Read the Certum signing certificate
        if: runner.os == 'Windows'
        id: certum
        shell: pwsh
        env:
          HAS_USERNAME: ${{ secrets.CERTUM_USERNAME != '' }}
          HAS_OTP_URI: ${{ secrets.CERTUM_OTP_URI != '' }}
          HAS_PFX: ${{ secrets.WIN_CSC_LINK != '' }}
        run: |
          if ($env:HAS_USERNAME -ne $env:HAS_OTP_URI) {
            throw 'Configure both CERTUM_USERNAME and CERTUM_OTP_URI in desktop-release.'
          }
          $pem = Get-Content -LiteralPath scripts/certum-signer.crt -Raw
          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::CreateFromPem($pem)
          "publisher=$($cert.Subject)" >> $env:GITHUB_OUTPUT
          if ($env:HAS_USERNAME -eq 'true') {
            "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          } elseif ($env:HAS_PFX -ne 'true') {
            throw 'Configure Yiwen SimplySign credentials or a Yiwen PFX in desktop-release.'
          }

      - name: Connect Certum SimplySign
        if: steps.certum.outputs.thumbprint != ''
        uses: dismine/windows-app-signing-setup-action@89ae3b032d4bc7a5b98d1a42a34e61ecb6faad64 # v1.2.5
        with:
          certum-username: ${{ secrets.CERTUM_USERNAME }}
          certum-otp-uri: ${{ secrets.CERTUM_OTP_URI }}
          certum-key-id: ${{ steps.certum.outputs.thumbprint }}
          simplysign-url: https://files.certum.eu/software/SimplySignDesktop/Windows/9.4.5.95/SimplySignDesktop-9.4.5.95-64-bit-en.msi

      - name: Package desktop
        shell: bash
        working-directory: desktop
        env:
          CSC_LINK: ${{ steps.certum.outputs.thumbprint == '' && secrets[matrix.certificate] || '' }}
          CSC_KEY_PASSWORD: ${{ steps.certum.outputs.thumbprint == '' && secrets[matrix.password] || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          ANDA_WINDOWS_CERT_SHA1: ${{ steps.certum.outputs.thumbprint }}
          ANDA_WINDOWS_PUBLISHER: ${{ steps.certum.outputs.publisher }}
        run: pnpm exec electron-builder --config electron-builder.release.cjs --publish never

      - name: Verify the Yiwen-signed Windows desktop
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EXPECTED_THUMBPRINT: ${{ steps.certum.outputs.thumbprint }}
          EXPECTED_PUBLISHER: ${{ steps.certum.outputs.publisher }}
        run: |
          foreach ($file in 'desktop/release/Anda-win-x64.exe', 'desktop/release/win-unpacked/Anda.exe') {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne 'Valid' -or !$signature.TimeStamperCertificate -or
                $signature.SignerCertificate.Subject -ne $env:EXPECTED_PUBLISHER -or
                ($env:EXPECTED_THUMBPRINT -and $signature.SignerCertificate.Thumbprint -ne $env:EXPECTED_THUMBPRINT)) {
              throw "Expected a timestamped Yiwen signature on $file ($($signature.Status), $($signature.SignerCertificate.Subject))"
            }
          }
          $bundled = Get-FileHash -LiteralPath 'desktop/release/win-unpacked/resources/runtime/anda.exe'
          if ($bundled.Hash -ne (Get-FileHash -LiteralPath $env:ANDA_DESKTOP_RUNTIME).Hash) {
            throw 'The bundled anda.exe differs from the standalone release binary.'
          }

      - name: Verify the notarized Yiwen update
        if: runner.os == 'macOS'
        run: |
          ditto -x -k desktop/release/Anda-mac-arm64.zip "$RUNNER_TEMP/anda-update"
          node scripts/macos-signing.cjs verify-package "$RUNNER_TEMP/anda-update/Anda.app" "$ANDA_DESKTOP_RUNTIME"
          xcrun stapler validate "$RUNNER_TEMP/anda-update/Anda.app"

      - name: Verify the update manifest against the signed package
        env:
          ANDA_WINDOWS_PUBLISHER: ${{ steps.certum.outputs.publisher }}
        run: node desktop/scripts/verify-release-feed.cjs

      - name: Prepare the LDC bridge for older macOS clients
        if: runner.os == 'macOS' && needs.version.outputs.channel == 'stable'
        run: bash scripts/stage-macos-bridge.sh desktop/release

      - name: Collect desktop artifacts
        shell: bash
        env:
          CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          mkdir -p desktop-release
          cp desktop/release/Anda-* desktop-release/
          if [ "$CHANNEL" = beta ]; then
            feed=beta.yml
            if [ "$RUNNER_OS" = macOS ]; then feed=beta-mac.yml; fi
            cp "desktop/release/$feed" desktop-release/
          elif [ "$RUNNER_OS" = macOS ]; then
            cp desktop/release/{latest,stable}-mac.yml desktop-release/
          else
            cp desktop/release/latest.yml desktop-release/latest.yml
          fi
          for file in desktop-release/Anda-*.dmg desktop-release/Anda-*.zip desktop-release/Anda-*.exe; do
            [ -f "$file" ] || continue
            if command -v sha256sum >/dev/null 2>&1; then
              hash="$(sha256sum "$file" | awk '{print $1}')"
            else
              hash="$(shasum -a 256 "$file" | awk '{print $1}')"
            fi
            echo "$hash  $(basename "$file")" > "${file}.sha256"
          done
          ls -lah desktop-release

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.target }}
          path: desktop-release/*
          if-no-files-found: error

  release:
    permissions:
      contents: write
    needs:
      - version
      - build-binary
      - sign-macos-binary
      - package-skills
      - build-desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Upload all assets to a draft
        id: upload
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ needs.version.outputs.channel == 'beta' }}
          files: release/*
          fail_on_unmatched_files: true

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.upload.outputs.id }}
          BETA: ${{ needs.version.outputs.channel == 'beta' }}
        run: |
          latest=true
          if [ "$BETA" = true ]; then latest=false; fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -F prerelease="$BETA" -f make_latest="$latest"

      - name: Publish Homebrew formula
        if: needs.version.outputs.channel == 'stable'
        env:
          CHECKSUM_DIR: release
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: scripts/publish-homebrew.sh "${{ github.ref_name }}"
