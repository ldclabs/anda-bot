name: Release
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build-binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            rust_target: x86_64-unknown-linux-musl
            goos: linux
            goarch: amd64
            exe_ext: ""
            cross: false
            build_dir: target
          - os: ubuntu-latest
            target: linux-arm64
            rust_target: aarch64-unknown-linux-musl
            goos: linux
            goarch: arm64
            exe_ext: ""
            cross: true
            build_dir: target-cross
          - os: windows-latest
            target: windows-x86_64
            rust_target: x86_64-pc-windows-msvc
            goos: windows
            goarch: amd64
            exe_ext: ".exe"
            cross: false
            build_dir: target
          - os: macos-15-intel
            target: macos-x86_64
            rust_target: x86_64-apple-darwin
            goos: darwin
            goarch: amd64
            exe_ext: ""
            cross: false
            build_dir: target
          - os: macos-latest
            target: macos-arm64
            rust_target: aarch64-apple-darwin
            goos: darwin
            goarch: arm64
            exe_ext: ""
            cross: false
            build_dir: target

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc@3.23.4

      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' && !contains(matrix.rust_target, 'linux-musl') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 libasound2-dev

      - name: Install musl tools (Linux)
        if: ${{ contains(matrix.rust_target, 'linux-musl') && !matrix.cross }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 musl-tools libasound2-dev linux-libc-dev

      - name: Install cross (ARM Linux)
        if: ${{ matrix.cross }}
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        if: ${{ !matrix.cross }}

      - name: Build Rust binary (native)
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.rust_target }} --bin anda
          # anda_launcher is now the transitional binary that retires the old
          # tray; older launchers and `anda update` still download it.
          if [[ "${{ matrix.target }}" == windows-* || "${{ matrix.target }}" == macos-* ]]; then
            cargo build --release --locked --target ${{ matrix.rust_target }} --bin anda_launcher
          fi

      - name: Build Rust binary (cross)
        if: ${{ matrix.cross }}
        shell: bash
        env:
          XDG_CACHE_HOME: /tmp/anda-xdg-cache
        run: |
          cross build --release --locked --target-dir ${{ matrix.build_dir }} --target ${{ matrix.rust_target }} --bin anda

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release
          cp "${{ matrix.build_dir }}/${{ matrix.rust_target }}/release/anda${{ matrix.exe_ext }}" "release/anda-${{ matrix.target }}${{ matrix.exe_ext }}"
          if [[ "${{ matrix.target }}" == windows-* || "${{ matrix.target }}" == macos-* ]]; then
            cp "${{ matrix.build_dir }}/${{ matrix.rust_target }}/release/anda_launcher${{ matrix.exe_ext }}" "release/anda_launcher-${{ matrix.target }}${{ matrix.exe_ext }}"
          fi

          ls -lah release

      - name: Check Artifact Signing configuration
        if: ${{ runner.os == 'Windows' }}
        id: artifact-signing-config
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
        run: |
          $missing = @(
            "AZURE_CLIENT_ID",
            "AZURE_TENANT_ID",
            "AZURE_SUBSCRIPTION_ID",
            "AZURE_ARTIFACT_SIGNING_ENDPOINT",
            "AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME",
            "AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME"
          ) | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }

          if ($missing.Count -gt 0) {
            Write-Host "Azure Artifact Signing is not fully configured; skipping Windows Authenticode signing. Missing: $($missing -join ', ')"
            "configured=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          "configured=true" >> $env:GITHUB_OUTPUT

      - name: Azure login for Artifact Signing
        if: ${{ runner.os == 'Windows' && steps.artifact-signing-config.outputs.configured == 'true' }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows binaries
        if: ${{ runner.os == 'Windows' && steps.artifact-signing-config.outputs.configured == 'true' }}
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\release
          files-folder-filter: exe,dll,msi,msix,msixbundle,appx,appxbundle,cab
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Anda Bot
          description-url: https://github.com/ldclabs/anda-bot

      - name: Verify Windows binary signatures
        if: ${{ runner.os == 'Windows' && steps.artifact-signing-config.outputs.configured == 'true' }}
        shell: pwsh
        run: |
          $extensions = @(".exe", ".dll", ".msi", ".msix", ".msixbundle", ".appx", ".appxbundle", ".cab")
          foreach ($file in Get-ChildItem -LiteralPath release -File | Where-Object { $extensions -contains $_.Extension.ToLowerInvariant() }) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $($file.FullName): $($signature.Status) $($signature.StatusMessage)"
            }
            Write-Host "Verified Authenticode signature for $($file.Name)"
          }

      - name: Generate checksums
        shell: bash
        run: |
          for file in release/*; do
            if command -v sha256sum >/dev/null 2>&1; then
              hash="$(sha256sum "$file" | awk '{print $1}')"
            elif command -v shasum >/dev/null 2>&1; then
              hash="$(shasum -a 256 "$file" | awk '{print $1}')"
            else
              hash="$(openssl dgst -sha256 "$file" | awk '{print $NF}')"
            fi
            echo "$hash  $(basename "$file")" > "${file}.sha256"
          done

          ls -lah release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  package-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Package skills
        shell: bash
        run: |
          mkdir -p release
          skills_archive="anda-skills.zip"

          (cd skills && zip -qr "../release/${skills_archive}" . -x '__pycache__/*' '*/__pycache__/*' '*.pyc' '.DS_Store' '*/.DS_Store')

          hash="$(sha256sum "release/${skills_archive}" | awk '{print $1}')"
          echo "$hash  ${skills_archive}" > "release/${skills_archive}.sha256"

          ls -lah release

      - name: Upload skills artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-skills
          path: release/*
          if-no-files-found: error

  build-desktop:
    needs: build-binary
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64
            exe_ext: ""
          - os: macos-15-intel
            target: macos-x86_64
            exe_ext: ""
          - os: windows-latest
            target: windows-x86_64
            exe_ext: ".exe"
    runs-on: ${{ matrix.os }}
    # Signing and notarization secrets live in this protected environment.
    environment: desktop-release
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4
        with:
          version: "11.7.0"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # The desktop bundles the exact anda binary this release publishes; the
      # app installs it at the shared CLI location instead of running it.
      - name: Download release runtime
        uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: runtime

      - name: Prepare bundled runtime
        shell: bash
        env:
          ANDA_DESKTOP_RUNTIME: ${{ github.workspace }}/runtime/anda-${{ matrix.target }}${{ matrix.exe_ext }}
        run: |
          chmod +x "$ANDA_DESKTOP_RUNTIME"
          pnpm --dir desktop build
          node desktop/scripts/prepare-runtime.mjs

      - name: Check desktop signing configuration
        id: signing
        shell: bash
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "Desktop signing is not configured; building unsigned packages without an update feed."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package desktop
        shell: bash
        working-directory: desktop
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ANDA_WINDOWS_PUBLISHER: ${{ vars.ANDA_WINDOWS_PUBLISHER }}
        run: |
          config=electron-builder.yml
          if [ "${{ steps.signing.outputs.configured }}" = "true" ]; then
            config=electron-builder.release.cjs
          fi
          args=(--config "$config" --publish never)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Desktop and CLI share the release version, which the update feed compares.
            args+=("-c.extraMetadata.version=${GITHUB_REF_NAME#v}")
          fi
          pnpm exec electron-builder "${args[@]}"

      - name: Collect desktop artifacts
        shell: bash
        run: |
          mkdir -p desktop-release
          cp desktop/release/Anda-* desktop-release/
          # Each macOS architecture writes latest-mac.yml; the release job merges them.
          if [ -f desktop/release/latest-mac.yml ]; then
            cp desktop/release/latest-mac.yml "desktop-release/latest-mac-${{ matrix.target }}.yml"
          fi
          if [ -f desktop/release/latest.yml ]; then
            cp desktop/release/latest.yml desktop-release/latest.yml
          fi
          for file in desktop-release/Anda-*.dmg desktop-release/Anda-*.zip desktop-release/Anda-*.exe; do
            [ -f "$file" ] || continue
            if command -v sha256sum >/dev/null 2>&1; then
              hash="$(sha256sum "$file" | awk '{print $1}')"
            else
              hash="$(shasum -a 256 "$file" | awk '{print $1}')"
            fi
            echo "$hash  $(basename "$file")" > "${file}.sha256"
          done
          ls -lah desktop-release

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.target }}
          path: desktop-release/*
          if-no-files-found: error

  release:
    needs:
      - build-binary
      - package-skills
      - build-desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Merge desktop update metadata
        run: node scripts/merge-desktop-update-metadata.mjs release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*

      - name: Publish Homebrew formula
        env:
          CHECKSUM_DIR: release
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: scripts/publish-homebrew.sh "${{ github.ref_name }}"
