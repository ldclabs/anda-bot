name: Validate Code Mode worker
on:
  push:
    branches: [codex/code-mode-worker-validation]
permissions:
  contents: read
jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc@3.23.4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Run tests
        env:
          RUST_MIN_STACK: 16777216
        run: cargo test --locked --workspace --profile ci
