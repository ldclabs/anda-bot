name: Validate Code Mode worker
on:
  push:
    branches: [codex/code-mode-worker-validation]
permissions:
  contents: read
jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: --all-features
            musl_target: x86_64-unknown-linux-musl
          - os: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc@3.23.4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Run tests
        env:
          RUST_MIN_STACK: 16777216
        run: cargo test --locked --workspace --profile ci ${{ matrix.features }}
      - name: Verify the native musl worker
        if: matrix.musl_target
        env:
          RUST_MIN_STACK: 16777216
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add ${{ matrix.musl_target }}
          cargo test --locked --profile ci -p anda_bot --target ${{ matrix.musl_target }} --test code_mode
