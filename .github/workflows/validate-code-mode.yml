name: Validate Code Mode worker
on:
  push:
    branches: [codex/code-mode-worker-validation]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc@3.23.4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Run Linux tests
        if: runner.os == 'Linux'
        env:
          RUST_MIN_STACK: 16777216
        run: cargo test --locked --workspace --profile ci --all-features
      - name: Build the Windows CI worker
        if: runner.os == 'Windows'
        run: cargo build --locked --profile ci -p anda_bot --bin anda
      - name: Identify the required AppContainer environment
        if: runner.os == 'Windows'
        run: python scripts/ci-code-mode-probe.py
