# Checks the desktop app and the Chrome extension on macOS and Windows.
# Signed release packages are built by release.yml.
name: Desktop
on:
  push:
    branches: ["main"]
    paths:
      [
        "desktop/**",
        "chrome-extension/**",
        "anda_bot/**",
        "skills/**",
        "Cargo.*",
        "pnpm-*",
        ".github/workflows/desktop.yml",
      ]
  pull_request:
    paths:
      [
        "desktop/**",
        "chrome-extension/**",
        "anda_bot/**",
        "skills/**",
        "Cargo.*",
        "pnpm-*",
        ".github/workflows/desktop.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.7.0"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc@3.23.4
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Type and contract checks
        run: |
          pnpm --dir desktop check
          pnpm --dir desktop test
          pnpm --dir chrome-extension check
          pnpm --dir chrome-extension test
          pnpm --dir chrome-extension i18n
          cargo test -p anda_bot app_protocol --bin anda
          cargo test -p anda_bot runtime_admission --bin anda
      - name: Build and exercise Electron
        run: |
          pnpm --dir desktop build
          pnpm --dir desktop test:e2e
      - name: Build local installer
        run: pnpm --dir desktop package
      - name: Windows install and uninstall smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: desktop/scripts/windows-install-smoke.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ runner.os }}
          path: |
            desktop/release/*.*
            desktop/test-results/
