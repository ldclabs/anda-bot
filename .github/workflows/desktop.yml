# Checks the desktop app and the Chrome extension on macOS and Windows, and
# packages the desktop around a fast, unoptimized `anda` to exercise the
# installer. The Rust tests run in test.yml; signed release packages are built
# by release.yml.
name: Desktop
on:
  push:
    branches: ["main"]
    paths:
      [
        "desktop/**",
        "chrome-extension/**",
        "anda_bot/**",
        "skills/**",
        "Cargo.*",
        "pnpm-*",
        ".github/workflows/desktop.yml",
      ]
  pull_request:
    paths:
      [
        "desktop/**",
        "chrome-extension/**",
        "anda_bot/**",
        "skills/**",
        "Cargo.*",
        "pnpm-*",
        ".github/workflows/desktop.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    # Windows defaults to pwsh, where only the last command of a multi-line
    # step decides its exit code, so an earlier failing check would pass.
    shell: bash
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.7.0"
      # Only the two projects exercised here: docsite and website are most of
      # the workspace's packages.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "./desktop..." --filter "./chrome-extension..."
      - name: Type and unit checks
        run: |
          pnpm --dir desktop check
          pnpm --dir desktop test
          pnpm --dir chrome-extension check
          pnpm --dir chrome-extension test
          pnpm --dir chrome-extension i18n
      - name: Build and exercise Electron
        run: |
          pnpm --dir desktop build
          pnpm --dir desktop test:e2e
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc@3.23.4
      - uses: dtolnay/rust-toolchain@stable
      # `shared-key: test` is the key test.yml's job derives from its id, so this
      # restores the cache of its `--profile ci` build, which already compiled
      # every dependency of `anda`. Keep this setup identical to test.yml's.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          cache-on-failure: true
      # The packaging checks only run `anda --version`, so an unoptimized build
      # is enough; the release profile's fat LTO alone took over half an hour.
      # release.yml bundles the real release binary.
      - name: Build the bundled runtime
        run: cargo build --locked -p anda_bot --bin anda --profile ci
      - name: Build local installer
        env:
          ANDA_DESKTOP_RUNTIME: ${{ github.workspace }}/target/ci/anda${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          node desktop/scripts/prepare-runtime.mjs
          pnpm --dir desktop exec electron-builder --publish never
      - name: Windows install and uninstall smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: desktop/scripts/windows-install-smoke.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ runner.os }}
          path: desktop/test-results/
