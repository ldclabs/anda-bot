appId: org.ldclabs.anda.desktop
productName: Anda
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
asar: true
afterPack: scripts/seal-runtime.cjs
asarUnpack:
  - node_modules/node-pty/**
electronDist: node_modules/electron/dist
extraResources:
  # The bundled anda only installs itself (and these curated skills) at the
  # shared CLI location; the app never runs it as the daemon.
  - from: resources/runtime
    to: runtime
  - from: ../skills
    to: runtime/skills
    filter: ['**/*', '!**/__pycache__/**', '!**/*.pyc', '!**/.DS_Store']
  - from: ../anda_bot/assets/logo-tray.png
    to: logo-tray.png
  - from: ../anda_bot/assets/config.yaml
    to: config-template.yaml
mac:
  identity: '-'
  signIgnore:
    - /Contents/Resources/runtime/anda$
  icon: ../anda_bot/assets/logo.icns
  category: public.app-category.productivity
  target: [dmg, zip]
  hardenedRuntime: true
  entitlements: resources/entitlements.local.plist
  entitlementsInherit: resources/entitlements.local.plist
  extendInfo:
    NSMicrophoneUsageDescription: Anda uses the microphone only when you record a voice message.
    NSAppleEventsUsageDescription: Anda opens files and folders you choose.
win:
  # electron-builder rejects a PNG under 256x256 when it builds the .ico.
  icon: ../anda_bot/assets/logo256.png
  target: [nsis]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  # Matches running processes by this install directory only; the default
  # prefix match would also stop the shared CLI in ...\Programs\AndaBot.
  include: resources/installer.nsh
linux:
  icon: ../anda_bot/assets/logo.png
  target: [AppImage]
protocols:
  - name: Anda chat
    schemes: [anda]
# Stable names let the website and Homebrew link to the latest release.
artifactName: Anda-${os}-${arch}.${ext}
