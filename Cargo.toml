[workspace]
resolver = "3"
members = ["anda_bot"]
exclude = ["vendor/weixin-agent"]

[workspace.package]
description = "🐼 Born of panda. Awakened as Anda. A copilot for your computer, powered by the ANDA Brain."
repository = "https://github.com/ldclabs/anda-bot"
homepage = "https://github.com/ldclabs/anda-bot"
keywords = ["knowledge-graph", "persistent-memory", "cognitive", "kip", "agent"]
categories = [
  "accessibility",
  "web-programming",
  "development-tools",
  "text-processing",
]
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[workspace.dependencies]
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
async-trait = "0.1"
# Default features already cover http1/json/matched-path/query/tokio; only
# http2 is additive.
axum = { version = "0.8", features = ["http2"] }
anda_core = { version = "0.16" }
anda_engine = { version = "0.16" }
anda_engine_server = { version = "0.16" }
anda_web3_client = { version = "0.16", features = ["client"] }
anda_object_store = "0.14"
anda_db = { version = "0.14", features = ["full"] }
anda_db_tfs = { version = "0.14", features = ["full"] }
anda_db_utils = { version = "0.14" }
anda_brain = { version = "0.13" }
anda_kip = "0.14"
anda_cognitive_nexus = "0.14"
anydoc = "0.2"
base64 = "0.23"
cpal = { version = "0.18" }
cbor2 = "1"
cose2 = "0.5"
ed25519-dalek = "3"
# Keep this exact: credential-store initialization has regressed in keyring
# patch releases before, so upgrades should be validated explicitly.
keyring = "=4.2.0"
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "std",
] }
chrono-tz = "0.10"
cron = "0.17"
futures = "0.3"
hkdf = "0.13"
http = "1.5"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
parking_lot = "0.12"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
# Keep YAML parser upgrades within the validated 1.0 release line.
serde-saphyr = "1"
sha3 = "0.12"
sha2 = "0.11"
ic_auth_types = "0.10"
ic-ed25519 = "0.6"
infer2 = { version = "0.21" }
object_store = { version = "0.14" }
# Default features already provide rustls (via default-tls) and http2.
reqwest = { version = "0.13", features = [
  "json",
  "gzip",
  "stream",
  "form",
  "multipart",
] }
rust-i18n = "4"
# Pulled in only to install a process-level CryptoProvider at startup. `aws_lc_rs`
# is the sole crypto backend in the tree (reqwest's rustls and cose2's
# `crypto-aws-lc-rs` both use it), so this adds the API without introducing a
# second provider.
rustls = { version = "0.23", default-features = false, features = [
  "aws_lc_rs",
] }
tokio-util = "0.7"
zeroize = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
structured-logger = "1"
log = { version = "0.4", features = ["kv_serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
tower-http = { version = "0.7", features = ["compression-gzip", "cors"] }
markdown = "1"
mimalloc = { version = "0.1", features = ["v3"] }
rand = "0.10"
prost = { version = "0.14", default-features = false, features = ["derive"] }
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
ratatui = { version = "0.30", default-features = true }
crossterm = { version = "0.29", features = ["event-stream"] }
tempfile = "3"
unicode-segmentation = "1"
unicode-width = "0.2"
weixin-agent = "0.2"
windows-sys = "0.61"
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

# Pin patches to explicit revs so builds stay reproducible even without the
# lockfile; bump the rev when upstream main moves.
[patch.crates-io]
# Brain 0.13.0 (Memory Interface, DB/KIP 0.14) comes from the sibling checkout
# until it is published; then delete this line and run `cargo update -p
# anda_brain`. The commented lines patch the rest of the shared stack from
# sibling checkouts for development; keep one DB/KIP/Core type identity (verify
# with `cargo metadata`).
anda_brain = { path = "../anda-brain/anda_brain" }
# anda_core = { path = "../anda/anda_core" }
# anda_engine = { path = "../anda/anda_engine" }
# anda_engine_server = { path = "../anda/anda_engine_server" }
# anda_web3_client = { path = "../anda/anda_web3_client" }
# anda_cognitive_nexus = { path = "../anda-db/rs/anda_cognitive_nexus" }
# anda_db = { path = "../anda-db/rs/anda_db" }
# anda_db_schema = { path = "../anda-db/rs/anda_db_schema" }
# anda_db_tfs = { path = "../anda-db/rs/anda_db_tfs" }
# anda_db_utils = { path = "../anda-db/rs/anda_db_utils" }
# anda_object_store = { path = "../anda-db/rs/anda_object_store" }
# anda_kip = { path = "../anda-db/rs/anda_kip" }
ratatui = { git = "https://github.com/ratatui/ratatui.git", rev = "3603d21f6b318007bbab0a0f1baefe337ebeae39" }
# Pinned source plus HTTP client injection; see vendor/weixin-agent/ANDA_PATCH.md.
weixin-agent = { path = "vendor/weixin-agent" }

[profile.dev.package."*"]
# Shrink dependency code and unwind tables so macOS debug builds fit the
# compact-unwind format's 24-bit DWARF offsets (16 MiB). Keep anda_bot itself
# unoptimized for debugging, and retain debug info and panic unwinding.
# The test profile inherits this override from dev.
opt-level = 1

# CI starts from disposable runners, where incremental state and debug symbols
# cost more to build and cache than they save. Reset the dependency override so
# the native test matrix compiles its large dependency graph without optimization.
[profile.ci]
inherits = "test"
debug = 0
incremental = false

[profile.ci.package."*"]
opt-level = 0

[profile.release]
lto = true
strip = true
opt-level = 'z'
codegen-units = 1
# cron/runtime.rs relies on catch_unwind for job isolation; do not switch to
# "abort" to shave binary size.
panic = "unwind"
